<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="assets/logo.webp" type="image/webp">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina nao encontrada – Medellin RP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <style>
        .error-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; text-align: center; padding: 2rem; }
        .error-code { font-size: 6rem; font-weight: 800; color: var(--accent, #00ff88); line-height: 1; margin-bottom: 0.5rem; }
        .error-msg { font-size: 1.25rem; color: var(--text-muted, #aaa); margin-bottom: 2rem; max-width: 400px; }
    </style>
</head>
<body>
    <header class="header" role="banner">
        <div class="header__inner wrap">
            <a href="index.html" class="header__brand" aria-label="Medellin RP">
                <img src="assets/logo.webp" alt="" class="header__logo" width="40" height="40">
                <span class="header__name">MEDELLIN <strong>RP</strong></span>
            </a>
        </div>
    </header>
    <main class="error-page">
        <div class="error-code">404</div>
        <p class="error-msg">Pagina nao encontrada. O link pode estar errado ou a pagina foi removida.</p>
        <a href="index.html" class="btn btn-primary btn-lg">Voltar para a Loja</a>
    </main>
    <footer class="footer" role="contentinfo">
        <div class="wrap footer__inner">
            <p class="footer__copy">&copy; 2026 Medellin RP. Todos os direitos reservados.</p>
        </div>
    </footer>
</body>
</html>
