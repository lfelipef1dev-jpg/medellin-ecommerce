<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testar pagamento – Medellin</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 1rem; background: #1a1a1a; color: #eee; }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    p { color: #aaa; font-size: 0.9rem; margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.35rem; font-size: 0.9rem; }
    input { width: 100%; padding: 0.6rem; font-size: 0.95rem; border: 1px solid #444; border-radius: 6px; background: #2a2a2a; color: #fff; }
    button { margin-top: 0.75rem; padding: 0.75rem 1.25rem; font-size: 1rem; background: #00FF88; color: #000; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { opacity: 0.9; }
    .ok { color: #00FF88; font-size: 0.85rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>Testar pagamento no site</h1>
  <p>1. Deixe a janela da API e do Ngrok abertas.<br>2. Na janela do <strong>Ngrok</strong>, copie a URL <strong>https://...</strong>.<br>3. Cole abaixo e clique no botão.</p>
  <label for="url">URL HTTPS do Ngrok:</label>
  <input type="text" id="url" placeholder="https://xxxx.ngrok-free.app" autocomplete="off">
  <button type="button" id="btn">Abrir checkout e testar pagamento</button>
  <p id="msg" class="ok" style="display:none;">Checkout aberto. Adicione um item, preencha o ID do painel e clique em Pagar com Mercado Pago.</p>
  <script>
    (function() {
      var input = document.getElementById('url');
      var btn = document.getElementById('btn');
      var msg = document.getElementById('msg');
      function openCheckout() {
        var v = (input.value || '').trim().replace(/\/+$/, '');
        if (!v) { alert('Cole a URL do Ngrok primeiro.'); return; }
        if (v.indexOf('https://') !== 0) { alert('A URL deve começar com https://'); return; }
        var u = 'https://roleplaymedellin.com.br/checkout.html?api_url=' + encodeURIComponent(v);
        window.open(u);
        msg.style.display = 'block';
      }
      btn.addEventListener('click', openCheckout);
      input.addEventListener('keypress', function(e) { if (e.key === 'Enter') openCheckout(); });
    })();
  </script>
</body>
</html>
