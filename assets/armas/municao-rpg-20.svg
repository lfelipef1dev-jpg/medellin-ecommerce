<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#050608"/><stop offset="35%" stop-color="#0a0d10"/><stop offset="100%" stop-color="#0e1115"/></linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.85"><stop offset="0%" stop-color="transparent"/><stop offset="100%" stop-color="#030405"/></radialGradient>
    <linearGradient id="gr" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#00FF88"/><stop offset="100%" stop-color="#00dd77"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Fundo GTA -->
  <rect width="200" height="200" rx="16" fill="url(#bg)"/>
  <rect width="200" height="200" rx="16" fill="url(#vignette)" opacity="0.6"/>
  <!-- Moldura verde -->
  <rect x="4" y="4" width="192" height="192" rx="14" fill="none" stroke="#00FF88" stroke-width="2" opacity="0.6"/>
  <rect x="8" y="8" width="184" height="184" rx="12" fill="none" stroke="#00FF88" stroke-width="0.8" opacity="0.3"/>
  <!-- Faixa topo: MEDELLIN -->
  <rect x="0" y="0" width="200" height="38" fill="#00FF88" opacity="0.14"/>
  <line x1="0" y1="0" x2="200" y2="0" stroke="#00FF88" stroke-width="1.2" opacity="0.6"/>
  <path d="M100 20 L104 26 L112 28 L106 33 L107 41 L100 38 L93 41 L94 33 L88 28 L96 26 Z" fill="none" stroke="#00FF88" stroke-width="1.2"/>
  <text x="100" y="34" text-anchor="middle" fill="#00FF88" font-family="Inter,Arial Black,Arial" font-size="12" font-weight="900" letter-spacing="0.22em">MEDELLIN</text>
  <!-- Sua imagem real do RPG (desenho central) -->
  <rect x="12" y="44" width="176" height="88" rx="10" fill="#080a0d"/>
  <image href="rpg-ammo-real.png" x="14" y="46" width="172" height="84" preserveAspectRatio="xMidYMid meet"/>
  <rect x="12" y="44" width="176" height="88" rx="10" fill="none" stroke="#00FF88" stroke-width="1.2" opacity="0.7"/>
  <!-- Quantidade e tipo -->
  <text x="100" y="148" text-anchor="middle" fill="#00FF88" font-family="Inter,Arial Black,Arial" font-size="34" font-weight="900" filter="url(#glow)">20</text>
  <text x="100" y="166" text-anchor="middle" fill="#00FF88" font-family="Inter,Arial" font-size="10" font-weight="700" letter-spacing="0.1em">MUNIÇÃO RPG</text>
  <line x1="36" y1="174" x2="164" y2="174" stroke="#00FF88" stroke-width="0.8" opacity="0.4"/>
  <text x="100" y="188" text-anchor="middle" fill="#00FF88" font-family="Inter,Arial" font-size="9" font-weight="700" letter-spacing="0.18em">MEDELLIN ROLEPLAY</text>
  <text x="100" y="198" text-anchor="middle" fill="#00FF88" font-family="Inter,Arial" font-size="7" font-weight="600" opacity="0.7">Tema GTA · Item real</text>
</svg>
