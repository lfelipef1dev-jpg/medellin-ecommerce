  <circle cx="125" cy="105" r="8" fill="url(#accent)" opacity="0.7"/>
  <text x="100" y="165" text-anchor="middle" fill="#00FF88" font-family="Inter, sans-serif" font-size="14" font-weight="600">Muni��o</text>
