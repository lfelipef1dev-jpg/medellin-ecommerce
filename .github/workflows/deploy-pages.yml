# Deploy automatico ao dar push (main/master)
# Configure em: Repositorio -> Settings -> Secrets and variables -> Actions:
#   CLOUDFLARE_API_TOKEN   (token com permissao Pages Edit)
#   CLOUDFLARE_ACCOUNT_ID  (sua Account ID)
# Funciona com repo raiz = Medellin (usa vip-store-web/) ou repo raiz = vip-store-web (usa .)

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir diretório do site
        id: site
        run: |
          if [ -d vip-store-web ]; then echo "dir=vip-store-web" >> $GITHUB_OUTPUT; else echo "dir=." >> $GITHUB_OUTPUT; fi

      - name: Preparar pasta de deploy
        run: |
          cd ${{ steps.site.outputs.dir }}
          mkdir -p _deploy/data
          cp *.html *.css *.js _deploy/ 2>/dev/null || true
          cp -r data/* _deploy/data/ 2>/dev/null || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy para Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _deploy --project-name=roleplaymedellin
          workingDirectory: ${{ steps.site.outputs.dir }}
